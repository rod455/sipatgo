<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" font-family="Arial, sans-serif">
  <!-- fundo: parede e piso -->
  <rect width="1000" height="625" fill="#E8EEF3"/>
  <rect y="430" width="1000" height="195" fill="#C9D3DC"/>
  <line x1="0" y1="430" x2="1000" y2="430" stroke="#9AA9B6" stroke-width="4"/>
  <rect x="380" y="40" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#9AA9B6" stroke-width="3"/>
  <text x="500" y="85" font-size="28" text-anchor="middle" fill="#13385C" font-weight="bold">OFICINA</text>

  <!-- ERRO 1 (x 6–24%, y 18–38%): trabalhador em altura sem cinto -->
  <g>
    <rect x="70" y="120" width="10" height="320" fill="#8A6D3B"/>
    <rect x="200" y="120" width="10" height="320" fill="#8A6D3B"/>
    <g stroke="#8A6D3B" stroke-width="8">
      <line x1="75" y1="160" x2="205" y2="160"/><line x1="75" y1="220" x2="205" y2="220"/>
      <line x1="75" y1="280" x2="205" y2="280"/><line x1="75" y1="340" x2="205" y2="340"/><line x1="75" y1="400" x2="205" y2="400"/>
    </g>
    <circle cx="140" cy="128" r="22" fill="#F2C9A0"/>
    <rect x="115" y="148" width="50" height="62" rx="10" fill="#1F5A8C"/>
    <rect x="118" y="208" width="18" height="50" fill="#13385C"/><rect x="144" y="208" width="18" height="50" fill="#13385C"/>
    <line x1="165" y1="160" x2="215" y2="125" stroke="#F2C9A0" stroke-width="10" stroke-linecap="round"/>
    <path d="M118 108 a22 14 0 0 1 44 0 z" fill="#FFC628"/>
  </g>

  <!-- ERRO 5 (x 44–56%, y 30–46%): esmerilhadeira sem óculos -->
  <g>
    <rect x="400" y="330" width="230" height="20" fill="#5B6B7B"/>
    <rect x="410" y="350" width="14" height="80" fill="#5B6B7B"/><rect x="606" y="350" width="14" height="80" fill="#5B6B7B"/>
    <circle cx="500" cy="215" r="24" fill="#C68B59"/>
    <circle cx="491" cy="212" r="3" fill="#111"/><circle cx="509" cy="212" r="3" fill="#111"/>
    <path d="M476 200 a24 16 0 0 1 48 0 z" fill="#FFC628"/>
    <rect x="472" y="238" width="56" height="70" rx="10" fill="#FF6A13"/>
    <line x1="528" y1="260" x2="560" y2="300" stroke="#C68B59" stroke-width="10" stroke-linecap="round"/>
    <rect x="550" y="295" width="40" height="18" rx="4" fill="#333"/>
    <circle cx="595" cy="312" r="14" fill="#999" stroke="#555" stroke-width="3"/>
    <g fill="#FFB000"><circle cx="612" cy="300" r="3"/><circle cx="620" cy="292" r="2.5"/><circle cx="606" cy="290" r="2"/><circle cx="625" cy="305" r="2"/></g>
  </g>

  <!-- ERRO 3 (x 58–72%, y 20–38%): extintor obstruído por caixas -->
  <g>
    <rect x="640" y="125" width="34" height="90" rx="10" fill="#EF4444"/>
    <rect x="648" y="112" width="18" height="16" fill="#333"/>
    <rect x="600" y="165" width="70" height="60" fill="#B98B54" stroke="#8A6D3B" stroke-width="3"/>
    <rect x="640" y="180" width="80" height="55" fill="#C99B64" stroke="#8A6D3B" stroke-width="3"/>
    <line x1="600" y1="195" x2="670" y2="195" stroke="#8A6D3B" stroke-width="2"/>
  </g>

  <!-- ERRO 2 (x 32–48%, y 62–78%): fios desencapados no chão -->
  <g fill="none" stroke-linecap="round">
    <path d="M300 470 C 360 430, 400 520, 470 470" stroke="#111" stroke-width="8"/>
    <path d="M470 470 l 12 -6" stroke="#D97706" stroke-width="4"/>
    <path d="M470 470 l 14 4" stroke="#D97706" stroke-width="4"/>
    <path d="M330 480 C 380 500, 410 440, 460 455" stroke="#1F2937" stroke-width="6"/>
    <path d="M478 462 l6 -10 l-2 10 l8 -6" stroke="#FFC628" stroke-width="3"/>
  </g>

  <!-- ERRO 4 (x 74–92%, y 56–78%): líquido derramado sem sinalização -->
  <g>
    <ellipse cx="830" cy="430" rx="85" ry="32" fill="#60A5FA" opacity=".75"/>
    <ellipse cx="800" cy="465" rx="55" ry="18" fill="#60A5FA" opacity=".6"/>
    <rect x="860" y="360" width="40" height="55" rx="6" fill="#22C55E" transform="rotate(70 880 388)"/>
  </g>

  <!-- elementos neutros (sem erro) -->
  <g>
    <rect x="860" y="150" width="90" height="120" rx="6" fill="#FFFFFF" stroke="#9AA9B6" stroke-width="3"/>
    <text x="905" y="195" font-size="18" text-anchor="middle" fill="#22C55E" font-weight="bold">SAÍDA</text>
    <path d="M885 225 h40 l-12 -12 m12 12 l-12 12" stroke="#22C55E" stroke-width="5" fill="none"/>
    <rect x="270" y="470" width="80" height="14" rx="4" fill="#FFC628" opacity=".0"/>
  </g>
</svg>
